# Included in the EB nginx http{} context.
# Large uploads + long FFmpeg jobs (export now returns 202 quickly, but
# download / health / other routes still need generous timeouts).
client_max_body_size 300M;
client_body_timeout 600s;
client_header_timeout 60s;

proxy_connect_timeout 60s;
proxy_send_timeout 600s;
proxy_read_timeout 600s;
send_timeout 600s;
